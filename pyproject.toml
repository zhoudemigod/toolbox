[project]
name = "open-goodies-toolbox-backend"
version = "0.1.0"
description = "Local media-processing backend for the Open Goodies desktop toolbox"
requires-python = ">=3.13,<3.14"
dependencies = [
  "av==18.1.0",
  "c2pa-python==0.38.0",
  "imageio-ffmpeg==0.6.0",
  "numpy==2.5.4",
  "onnxruntime==1.26.0",
  "opencv-python-headless==5.0.0.93",
  "piexif==1.1.3",
  "pillow==13.0.0",
  "remove-ai-watermarks==0.46.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["runtime/embedded"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
include = ["runtime", "tests"]
exclude = ["runtime/embedded"]
typeCheckingMode = "standard"
